  - id: "360cert_report"
    name: "360CERT 安全报告"
    region: "CN"
    category: "threat_research_lab"
    content_type: "threat_intel"
    source_quality: "primary"
    parser: "html"
    url: "https://cert.360.cn/report"
    enabled: true
    rate_limit_seconds: 5
    tags: ["360", "apt", "malware", "report"]
    notes: "官网提供 HTML 报告列表，质量较高"
    expected_fields: ["title", "published_at", "summary"]
    safety_policy: "strict_no_poc"

