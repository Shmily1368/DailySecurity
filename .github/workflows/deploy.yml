name: Deploy Astro site to Pages

on:
  # 在推送到 main 分支时触发（主要是当 daily.yml 更新了 data/ 之后）
  push:
    branches: ["main"]
  # 当 Daily 数据流水线完成后触发，避免 GITHUB_TOKEN push 不触发后续 workflow
  workflow_run:
    workflows: ["Daily Security Radar Update"]
    types: [completed]
  # 允许手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发的部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # workflow_run 仅在上游成功时继续，push / 手动触发则直接运行
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd src
          npm ci
      - name: Build Astro
        run: |
          cd src
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
