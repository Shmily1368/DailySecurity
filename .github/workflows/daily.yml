name: Daily Security Radar Update

on:
  schedule:
    # 07:47 / 08:07 / 08:27 Beijing; late recovery at 09:07.
    - cron: '47 23 * * *'
    - cron: '7,27 0 * * *'
    - cron: '7 1 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Collect again even if today is already published'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    outputs:
      data_sha: ${{ steps.commit.outputs.sha }}
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Record the actual checkout revision
        run: |
          bash scripts/setup_ci_git.sh
          printf 'DATA_COMMIT=%s\n' "$(./git-personal rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check whether today is already published
        id: gate
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: python scripts/publication.py gate
      - name: Install dependencies
        if: steps.gate.outputs.collect == 'true'
        run: pip install -r requirements-dev.txt
      - name: Offline regression
        if: steps.gate.outputs.collect == 'true'
        run: |
          python -m pytest scripts/tests -q --tb=short
          python scripts/check_pipeline.py
      - name: Collect, summarize and atomically publish
        if: steps.gate.outputs.collect == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scripts/run_pipeline.py --source-timeout 180 --llm-timeout 120
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics-${{ github.run_id }}
          path: data/tmp/pipeline/
          retention-days: 14
          if-no-files-found: ignore
      - name: Commit the verified data and record its SHA
        id: commit
        run: |
          ./git-personal add data/
          if ! ./git-personal diff --staged --quiet; then
            ./git-personal commit -m "chore(data): publish verified daily security snapshot"
            ./git-personal push origin HEAD:main
          fi
          printf 'sha=%s\n' "$(./git-personal rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: update-data
    if: needs.update-data.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update-data.outputs.data_sha }}
