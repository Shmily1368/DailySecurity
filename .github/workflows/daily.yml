name: Daily Security Radar Update

on:
  schedule:
    # 每天 UTC 00:37 运行 (北京时间 08:37)
    - cron: '37 0 * * *'
  workflow_dispatch:
    inputs:
      force_mock:
        description: 'Force mock mode (do not use LLM API)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # 允许推送 data/ 到仓库

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update-data:
    name: "Update Data Pipeline"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Collect, summarize and validate current data
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          FORCE_MOCK: ${{ inputs.force_mock }}
        run: |
          if [ "$FORCE_MOCK" = "true" ]; then
            python scripts/run_pipeline.py --mock
          else
            python scripts/run_pipeline.py
          fi

      - name: Upload pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics-${{ github.run_id }}
          path: data/tmp/pipeline/
          retention-days: 14
          if-no-files-found: ignore
        
      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          # 只有在有变更的情况下才提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto update daily security radar" && git push)
