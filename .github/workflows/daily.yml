name: Daily Security Radar Update

on:
  schedule:
    # 每天 UTC 00:37 运行 (北京时间 08:37)
    - cron: '37 0 * * *'
  workflow_dispatch:
    inputs:
      force_mock:
        description: 'Force mock mode (do not use LLM API)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # 允许推送 data/ 到仓库

jobs:
  update-data:
    name: "Update Data Pipeline"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Fetch arXiv & Top Conferences Papers
        run: |
          python scripts/fetch_arxiv.py --max-results 200
          python scripts/fetch_top_conferences.py --limit-per-conf 5
        
      - name: Fetch CISA KEV
        run: python scripts/fetch_cisa_kev.py --days 2
        
      - name: Fetch NVD CVEs
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/fetch_nvd.py --days 2
        
      - name: Fetch EPSS
        run: python scripts/fetch_epss.py --input data/raw/cisa_kev.json --input data/raw/nvd_recent.json
        continue-on-error: true # 容忍 EPSS 接口不稳定
        
      - name: Fetch GitHub Advisory & OSV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_github_advisory.py || true
          python scripts/fetch_osv.py --nvd-source data/raw/nvd_recent.json --limit 500 || true
          
      - name: Fetch Vendor Advisories
        run: python scripts/fetch_vendor_advisories.py --days 1 --limit-per-source 50
        continue-on-error: true
        
      - name: Fetch Threat Intelligence
        run: python scripts/fetch_threat_intel.py --days 1 --limit-per-source 50
        continue-on-error: true
        
      - name: Summarize with LLM (Dynamic Mode)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          # 检查是否有真实 API KEY, 如果没有或手动勾选了 force_mock, 则使用 mock 模式
          MOCK_FLAG=""
          if [ -z "$OPENAI_API_KEY" ] || [ "${{ github.event.inputs.force_mock }}" == "true" ]; then
            echo "OPENAI_API_KEY is not set or force_mock is true. Using --mock mode."
            MOCK_FLAG="--mock"
          else
            echo "Using LLM_BASE_URL: ${LLM_BASE_URL:-default}"
            echo "Using LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}"
          fi
          
          python scripts/summarize_with_llm.py \
            --input data/raw/arxiv_latest.json \
            --input data/raw/top_conferences.json \
            --output data/processed/paper_digest.json \
            $MOCK_FLAG || true
            
          python scripts/summarize_with_llm.py \
            --input data/raw/cisa_kev.json \
            --input data/raw/nvd_recent.json \
            --input data/raw/github_advisory_latest.json \
            --input data/raw/osv_latest.json \
            --output data/processed/daily_digest.json \
            --limit 20 \
            $MOCK_FLAG || true
            
          python scripts/summarize_with_llm.py \
            --input data/raw/vendor_advisories.json \
            --output data/processed/vendor_advisories_digest.json \
            --limit 30 \
            $MOCK_FLAG || true
            
          python scripts/summarize_with_llm.py \
            --input data/raw/threat_intel.json \
            --output data/processed/threat_intel_digest.json \
            --limit 30 \
            $MOCK_FLAG || true
            
      - name: Build Daily Digest & Rank
        run: python scripts/build_daily_digest.py
        
      - name: Validate Data
        run: python scripts/validate_data.py --all
        
      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          # 只有在有变更的情况下才提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto update daily security radar" && git push)
